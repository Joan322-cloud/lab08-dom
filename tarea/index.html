<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarea Lab 08 - Mis tareas de estudio</title>
<style>
body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; }
section { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
input { margin-right: 6px; }
ul { padding-left: 0; list-style: none; }
li { padding: 6px 0; border-bottom: 1px solid #eee; }
li button { margin-left: 6px; }
.hecha { text-decoration: line-through; color: #888; }
.error { color: #c0392b; }
</style>
</head>
<body>
<h1>Mis tareas de estudio</h1>

<section>
<h2>Agregar tarea</h2>
<form id="formTarea">
<input id="titulo" type="text" placeholder="Que tengo que hacer">
<input id="curso" type="text" placeholder="Curso">
<button type="submit">Agregar</button>
</form>
<p id="mensaje"></p>
</section>

<section>
<h2>Lista</h2>
<p>Pendientes: <span id="pendientes">0</span></p>
<ul id="listaTareas"></ul>
</section>

<script src="app.js"></script>
</body>
</html>
